.city-wash{
z-index:-2;
background:radial-gradient(circle at 18% 20%,#42a6ae38,#0000 35%),radial-gradient(circle at 82% 64%,#bd413e38,#0000 32%),linear-gradient(#030a116b,#05090e14 38%,#03080db3)}
.scanlines{
z-index:5;
opacity:.1;
mix-blend-mode:soft-light;
background:repeating-linear-gradient(0deg,#0000 0 3px,#ffffff17 4px)}
.profile{
text-align:center;
width:min(100%,430px);
margin-top:4vh}
.eyebrow{
color:#e2edeca3;
letter-spacing:.29em;
text-transform:uppercase;
margin:0 0 14px;
font-size:9px;
font-weight:600;
animation:.7s .2s both rise}
h1{
letter-spacing:-.105em;
text-shadow:0 4px 40px #0000007a;
margin:0 -10px;
font-family:Unbounded,sans-serif;
font-size:clamp(3.8rem,18.5vw,6.8rem);
font-weight:800;
line-height:.92;
animation:.8s cubic-bezier(.2,.8,.2,1) .28s both rise;
position:relative}
h1:after{
content:attr(data-text);
z-index:-1;
color:#0000;
-webkit-text-stroke:1px #6dd3d9bf;
opacity:.7;
position:absolute;
inset:0;
transform:translate(2px,2px)}
.subtitle{
color:#f2f1edb8;
letter-spacing:.08em;
margin:18px 0 34px;
font-size:12px;
animation:.7s .38s both rise}
.socials{
gap:11px;
display:grid}
.social-link{
border:1px solid var(--line);
background:var(--surface);
text-align:left;
-webkit-backdrop-filter:blur(18px)saturate(125%);
border-radius:18px;
grid-template-columns:46px 1fr 24px;
align-items:center;
min-height:68px;
padding:10px 16px 10px 11px;
text-decoration:none;
transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s;
animation:.7s both rise;
display:grid;
overflow:hidden;
box-shadow:0 18px 50px #00000038,inset 0 1px #ffffff0d}
.social-link:first-child{
animation-delay:.48s}
.social-link:nth-child(2){
animation-delay:.58s}
.social-icon{
border:1px solid #ffffff29;
border-radius:13px;
place-items:center;
width:46px;
height:46px;
display:grid}
.social-link--vk .social-icon{
background:#478fb433}
.social-link--max .social-icon{
background:#bb52642e}
.social-icon svg{
fill:currentColor;
width:25px;
height:25px}
.social-icon rect,.social-icon circle{
fill:none;
stroke:currentColor;
stroke-width:1.7px}
.social-icon .icon-fill{
fill:currentColor;
stroke:none}
.social-copy{
gap:2px;
padding-left:13px;
display:grid}
.social-label{
letter-spacing:.01em;
font-size:14px;
font-weight:600}
.social-hint{
color:var(--muted);
letter-spacing:.08em;
text-transform:uppercase;
font-size:9px}
.arrow-icon{
fill:none;
stroke:#ffffffbd;
stroke-linecap:round;
stroke-linejoin:round;
stroke-width:1.5px;
width:21px;
transition:transform .3s}
.social-link:hover,.social-link:focus-visible{
background:#121b26ab;
border-color:#ffffff6b;
outline:none;
transform:translateY(-3px)}
.social-link:active{
transform:scale(.985)}
.social-link:hover .arrow-icon,.social-link:focus-visible .arrow-icon{
transform:translate(3px,-3px)}
.location{
bottom:max(18px,env(safe-area-inset-bottom));
color:#f2f1ed66;
letter-spacing:.17em;
text-transform:uppercase;
align-items:center;
gap:8px;
margin:0;
font-size:8px;
animation:.7s .68s both rise;
display:flex;
position:absolute;
left:20px}
.location span{
background:var(--cyan);
border-radius:50%;
width:5px;
height:5px;
box-shadow:0 0 12px #7ac4c8d9}
@keyframes rise{
0%{
opacity:0;
transform:translateY(14px)}
to{
opacity:1;
transform:translateY(0)}
}
@keyframes city-arrival{
0%{
opacity:0;
transform:scale(1.06)}
to{
opacity:1;
transform:scale(1)}
}
@media(min-width:700px){
.maylov-page{
padding-inline:40px}
.profile{
width:min(100%,520px)}
.location{
left:40px}
}
@media(max-height:660px){
.profile{
margin-top:0}
.subtitle{
margin-block:12px 20px}
.social-link{
min-height:60px}
.location{
display:none}
}
@media(prefers-reduced-motion:reduce){
*,:before,:after{
animation-duration:.01ms!important;
animation-delay:0s!important}
}

/* ОБНОВЛЕНИЕ: неоновый расфокус и градиент заголовка.
   Меняйте blur для силы размытия и цвета в linear-gradient. */
.city-background {
  inset: -28px;
  filter: blur(9px) saturate(1.85) brightness(1.12);
}
.city-wash {
  background:
    radial-gradient(ellipse at 16% 24%, rgba(0, 230, 255, .34), transparent 52%),
    radial-gradient(ellipse at 85% 55%, rgba(255, 38, 173, .33), transparent 48%),
    radial-gradient(ellipse at 48% 82%, rgba(124, 62, 255, .27), transparent 55%),
    linear-gradient(180deg, rgba(3, 7, 18, .36), rgba(4, 8, 18, .12) 40%, rgba(3, 6, 16, .66));
}
/* Размер адаптирован к более длинной надписи NeЧердак. Шрифт тот же. */
h1 {
  font-size: clamp(2.45rem, 11.5vw, 5.2rem);
  background: linear-gradient(110deg, #73f7ff 5%, #a4bcff 38%, #ca87ff 64%, #ff79c9 95%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0 14px rgba(118, 144, 255, .28));
}
h1::after {
  background: none;
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 1px rgba(112, 232, 255, .36);
  opacity: .55;
  transform: translate(2px, 2px);
}


/* Финальные правки: убрать подпись снизу, увеличить год,
   сохранить градиент, убрать прозрачность и контур заголовка. */
.eyebrow { font-size: 13px; }
h1 { opacity: 1; animation: none; filter: none; }
h1::after { display: none; }
